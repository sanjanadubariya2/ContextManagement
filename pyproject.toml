[project]
name = "multiplayer-context"
version = "0.2.0"
description = "MultiPlayer-Context: governed, role-scoped context for nine developers and their agents"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "anthropic>=0.70",
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
    "langgraph>=0.4",
    "google-genai>=1.0",
]

[project.optional-dependencies]
voyage = ["voyageai>=0.3"]

[dependency-groups]
dev = ["pytest>=8"]
site = [
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pyjwt>=2.15.1",
]

[project.scripts]
mpc = "mpc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the local Postgres and Redis from docker compose"]

[tool.uv]
# `site` holds the starter website's own runtime deps, so Testing workers'
# tests can import the generated backend.
default-groups = ["dev", "site"]
