[project]
name = "multiplayer-context"
version = "0.2.0"
description = "MultiPlayer-Context: governed, role-scoped context for nine developers and their agents"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "anthropic>=0.70",
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
voyage = ["voyageai>=0.3"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
mpc = "mpc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the local Postgres and Redis from docker compose"]
