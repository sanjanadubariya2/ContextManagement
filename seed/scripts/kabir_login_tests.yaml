# Isolated testing (plan scenario step 9). Kabir's Testing Worker writes tests
# from the requirements and the contract only, runs them in the sandboxed
# runner, and files a bug for the Backend team when the code breaks the
# contract. Run it BEFORE sneha_login_api.yaml to see the 422-vs-400 bug found;
# after Sneha's fix, `uv run mpc run-tests tests/backend/test_login_contract.py` passes.
name: Kabir's login contract tests (t22)
member: kabir
task: t22
request: Write contract tests for POST /api/auth/login and GET /api/auth/me, run them, and report failures.
expect:
  action: delegate
  status: completed
  promoted: [tests/backend/test_login_contract.py]
  bugs: 1

steps:
  personal:
    - tool: delegate
      input:
        task_id: t22
        instructions: >-
          Write pytest tests for /api/auth/login and /api/auth/me from openapi/auth.yaml and the
          requirements (no database needed): an invalid email is 400 problem+json, and /me
          without the cookie is 401. Run them; file a bug with the owning team for any failure.

  worker:
    - tool: list_files
      input: {prefix: tests/}
    - tool: write_file
      input:
        path: tests/backend/test_login_contract.py
        content: |
          """Contract tests for the auth API, from openapi/auth.yaml and the requirements."""

          from fastapi.testclient import TestClient

          from app.main import app

          client = TestClient(app)


          def test_invalid_email_is_400_problem_json():
              res = client.post("/api/auth/login", json={"email": "not-an-email", "password": "longenough"})
              assert res.status_code == 400
              assert res.headers["content-type"].startswith("application/problem+json")


          def test_short_password_is_400():
              res = client.post("/api/auth/login", json={"email": "a@example.com", "password": "short"})
              assert res.status_code == 400


          def test_me_requires_the_cookie():
              assert client.get("/api/auth/me").status_code == 401
    - tool: run_tests
      input: {paths: [tests/backend/test_login_contract.py]}
    - tool: report_bug
      input:
        team: backend
        title: Malformed login requests return 422, contract says 400 problem+json
        description: >-
          tests/backend/test_login_contract.py: POST /api/auth/login with an invalid email or a
          short password returns FastAPI's default 422. openapi/auth.yaml and the requirements
          promise 400 with application/problem+json.
    - tool: finish
      input:
        summary: >-
          Added three contract tests for login and /me. The validation tests fail against the
          current backend (422 instead of 400); filed a bug on the Backend board.
